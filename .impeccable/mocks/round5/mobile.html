<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Banking Test Lab · Mobile</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ground: #f2f2f5;
        --paper: #fff;
        --ink: #121216;
        --ink-2: #1d1d24;
        --muted: #62626e;
        --violet: #5b3df5;
        --violet-d: #4a2fe0;
        --violet-soft: #efecff;
        --coral: #ff6b4a;
        --coral-soft: #fff0ec;
        --pos: #0e7a4b;
        --pos-soft: #e6f5ee;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html {
        background: #d9d9e0;
      }
      body {
        width: 390px;
        height: 844px;
        margin: 24px auto;
        border-radius: 40px;
        overflow: hidden;
        font:
          15px/1.5 Manrope,
          system-ui,
          sans-serif;
        color: var(--ink);
        background: var(--ground);
        position: relative;
      }
      .num {
        font-variant-numeric: tabular-nums;
      }
      .hero {
        background: var(--ink);
        color: #fff;
        padding: 18px 20px 26px;
        border-radius: 0 0 32px 32px;
      }
      .bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .avatar {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--violet-d), #a3304f);
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 13px;
      }
      .env {
        font-size: 11px;
        font-weight: 700;
        background: var(--ink-2);
        color: #d8d2ff;
        border-radius: 999px;
        padding: 6px 11px;
        box-shadow: inset 0 0 0 1px #2e2e38;
      }
      .stack {
        position: relative;
        height: 168px;
        margin: 22px 0 6px;
      }
      .vcard {
        position: absolute;
        left: 50%;
        width: 270px;
        height: 164px;
        border-radius: 20px;
        padding: 16px 18px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .vcard.back {
        transform: translateX(-38%) rotate(8deg);
        background: linear-gradient(135deg, #ff8a6b, #ff6b4a 60%, #e2553a);
        top: 2px;
      }
      .vcard.front {
        transform: translateX(-56%) rotate(-5deg);
        background: linear-gradient(150deg, #6b4dff 0%, #4a2fe0 45%, #2a1a9a 100%);
        box-shadow:
          0 24px 40px -18px rgba(0, 0, 0, 0.8),
          inset 0 1px 0 rgba(255, 255, 255, 0.18);
        top: 4px;
      }
      .vrow {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: 700;
      }
      .chip {
        width: 32px;
        height: 24px;
        border-radius: 6px;
        background: linear-gradient(135deg, #f6d7a7, #d7a95c);
      }
      .vnum {
        letter-spacing: 0.14em;
        font-weight: 600;
        font-size: 14px;
      }
      .center {
        text-align: center;
      }
      .label {
        color: #b9b9c8;
        font-weight: 600;
        font-size: 13px;
      }
      .bal {
        font-size: 44px;
        font-weight: 800;
        letter-spacing: -0.045em;
        line-height: 1.1;
      }
      .bal small {
        font-size: 22px;
        color: #d6d6e0;
      }
      .delta {
        display: inline-block;
        margin-top: 6px;
        font-weight: 700;
        font-size: 12px;
        color: #8fe3bb;
        background: #173527;
        border-radius: 999px;
        padding: 4px 10px;
      }
      .actions {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
        padding: 0 4px;
      }
      .act {
        display: grid;
        justify-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
      }
      .act span {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: var(--ink-2);
        display: grid;
        place-items: center;
        box-shadow: inset 0 0 0 1px #2e2e38;
      }
      .act.primary span {
        background: var(--violet);
        box-shadow: none;
      }
      .act svg {
        width: 20px;
        height: 20px;
      }
      .sheet {
        background: var(--paper);
        border-radius: 24px;
        margin: 14px;
        padding: 14px 16px;
      }
      .sheet h2 {
        font-size: 17px;
        font-weight: 800;
        display: flex;
        justify-content: space-between;
      }
      .sheet h2 a {
        font-size: 13px;
        color: var(--violet-d);
        text-decoration: none;
      }
      .day {
        font-size: 11px;
        font-weight: 700;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-top: 8px;
      }
      .tx {
        display: grid;
        grid-template-columns: 40px 1fr auto;
        gap: 12px;
        align-items: center;
        padding: 8px 0;
      }
      .ic {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: grid;
        place-items: center;
      }
      .ic svg {
        width: 18px;
        height: 18px;
      }
      .i-out {
        background: var(--coral-soft);
        color: #b73d22;
      }
      .i-in {
        background: var(--pos-soft);
        color: var(--pos);
      }
      .i-rc {
        background: var(--violet-soft);
        color: var(--violet-d);
      }
      .tx b {
        display: block;
        font-weight: 700;
      }
      .tx small {
        color: var(--muted);
        font-size: 12px;
      }
      .amt {
        font-weight: 800;
      }
      .pos {
        color: var(--pos);
      }
      .tabs {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--paper);
        display: flex;
        justify-content: space-around;
        padding: 10px 0 24px;
        font-size: 11px;
        font-weight: 700;
        color: var(--muted);
      }
      .tabs a {
        display: grid;
        justify-items: center;
        gap: 3px;
        color: inherit;
        text-decoration: none;
      }
      .tabs a.on {
        color: var(--ink);
      }
      .tabs svg {
        width: 22px;
        height: 22px;
      }
    </style>
  </head>
  <body>
    <section class="hero num">
      <div class="bar">
        <div class="avatar">AP</div>
        <span class="env">Test environment</span>
      </div>
      <div class="stack" aria-hidden="true">
        <div class="vcard back"></div>
        <div class="vcard front">
          <div class="vrow">
            <span>Savings</span
            ><svg width="24" height="24" viewBox="0 0 32 32">
              <path
                d="M10 22V10h6.5a3 3 0 0 1 0 6H10m6.5 0H18a3 3 0 0 1 0 6h-8"
                fill="none"
                stroke="#fff"
                stroke-width="2.5"
                stroke-linejoin="round"
              />
              <circle cx="24" cy="10" r="3" fill="#ff6b4a" />
            </svg>
          </div>
          <span class="chip"></span>
          <span class="vnum">0012 345 678</span>
        </div>
      </div>
      <div class="center">
        <p class="label">Savings balance</p>
        <p class="bal">$12,480<small>.50</small></p>
        <span class="delta">▲ +$2,650.00 this month</span>
      </div>
      <div class="actions">
        <div class="act primary">
          <span
            ><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2">
              <path d="M5 12h14M13 6l6 6-6 6" /></svg></span
          >Transfer
        </div>
        <div class="act">
          <span
            ><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2">
              <path d="M12 5v14M5 12h14" /></svg></span
          >Add account
        </div>
        <div class="act">
          <span
            ><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2">
              <rect x="4" y="5" width="16" height="14" rx="3" />
              <path d="M8 10h8M8 14h5" /></svg></span
          >Details
        </div>
        <div class="act">
          <span
            ><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2">
              <path d="M12 7v5l3 2" />
              <circle cx="12" cy="12" r="8" /></svg></span
          >History
        </div>
      </div>
    </section>
    <section class="sheet num">
      <h2>Transactions <a href="#">See all</a></h2>
      <p class="day">Today</p>
      <div class="tx">
        <span class="ic i-out"
          ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M7 17L17 7M9 7h8v8" /></svg></span
        ><span><b>To 0098765432</b><small>10:42 · Transfer out</small></span
        ><span class="amt">−$400.00</span>
      </div>
      <p class="day">Nov 9</p>
      <div class="tx">
        <span class="ic i-rc"
          ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <rect x="3" y="6" width="18" height="12" rx="3" />
            <circle cx="12" cy="12" r="2.5" /></svg></span
        ><span><b>Salary</b><small>08:00 · Recharge</small></span
        ><span class="amt pos">+$3,200.00</span>
      </div>
    </section>
    <nav class="tabs" aria-label="Main navigation">
      <a class="on" href="#" aria-current="page"
        ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 10l9-6 9 6v10H3z" /></svg
        >Home</a
      >
      <a href="#"
        ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 8h13l-3-3M20 16H7l3 3" /></svg
        >Transfers</a
      >
      <a href="#"
        ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="6" width="18" height="13" rx="3" />
          <path d="M3 10h18" /></svg
        >Accounts</a
      >
      <a href="#"
        ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 7v5l3 2" />
          <circle cx="12" cy="12" r="9" /></svg
        >History</a
      >
    </nav>
  </body>
</html>
