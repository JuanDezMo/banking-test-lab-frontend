<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Banking Test Lab · Mobile</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ground: #f2f2f5;
        --paper: #fff;
        --ink: #121216;
        --muted: #6b6b76;
        --violet: #5b3df5;
        --violet-soft: #efecff;
        --pos: #0e7a4b;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html {
        background: #d9d9e0;
      }
      body {
        width: 390px;
        min-height: 844px;
        margin: 24px auto;
        border-radius: 36px;
        overflow: hidden;
        font:
          15px/1.5 Manrope,
          system-ui,
          sans-serif;
        color: var(--ink);
        background: var(--ground);
        position: relative;
      }
      .num {
        font-variant-numeric: tabular-nums;
      }
      .hero {
        padding: 20px 20px 28px;
        color: #fff;
        background: linear-gradient(135deg, #4a2fe0 0%, #3b24bd 55%, #21166f 100%);
        position: relative;
        overflow: hidden;
      }
      .hero > * {
        position: relative;
        z-index: 1;
      }
      .bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.22);
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 13px;
      }
      .env {
        font-size: 11px;
        font-weight: 700;
        background: rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        padding: 5px 10px;
      }
      .center {
        text-align: center;
        margin-top: 28px;
      }
      .pill {
        display: inline-block;
        background: rgba(255, 255, 255, 0.16);
        border-radius: 999px;
        padding: 5px 12px;
        font-weight: 600;
        font-size: 13px;
      }
      .bal {
        font-size: 46px;
        font-weight: 800;
        letter-spacing: -0.04em;
        margin-top: 10px;
      }
      .bal small {
        font-size: 24px;
        opacity: 1;
      }
      .actions {
        display: flex;
        justify-content: space-between;
        margin-top: 24px;
        padding: 0 6px;
      }
      .act {
        display: grid;
        justify-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 600;
      }
      .act span {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        display: grid;
        place-items: center;
      }
      .act svg {
        width: 20px;
        height: 20px;
      }
      .sheet {
        background: var(--paper);
        border-radius: 24px;
        margin: 16px;
        padding: 16px 18px;
      }
      .sheet h2 {
        font-size: 17px;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .tx {
        display: grid;
        grid-template-columns: 40px 1fr auto;
        gap: 12px;
        align-items: center;
        padding: 10px 0;
      }
      .ic {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 700;
      }
      .i-out {
        background: #fff0ec;
        color: #b73d22;
      }
      .i-in {
        background: #e8f6ef;
        color: var(--pos);
      }
      .i-rc {
        background: var(--violet-soft);
        color: var(--violet);
      }
      .tx b {
        display: block;
        font-weight: 700;
      }
      .tx small {
        color: var(--muted);
        font-size: 12px;
      }
      .amt {
        font-weight: 700;
      }
      .pos {
        color: var(--pos);
      }
      .tabs {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--paper);
        display: flex;
        justify-content: space-around;
        padding: 10px 0 22px;
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
      }
      .tabs a {
        display: grid;
        justify-items: center;
        gap: 3px;
        color: inherit;
        text-decoration: none;
      }
      .tabs a.on {
        color: var(--ink);
      }
      .tabs svg {
        width: 22px;
        height: 22px;
      }
    </style>
  </head>
  <body>
    <section class="hero num">
      <div class="bar">
        <div class="avatar">AP</div>
        <span class="env">Test environment</span>
      </div>
      <div class="center">
        <span class="pill">Savings · 0012345678</span>
        <p class="bal">$12,480<small>.50</small></p>
      </div>
      <div class="actions">
        <div class="act">
          <span
            ><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2">
              <path d="M5 12h14M13 6l6 6-6 6" /></svg></span
          >Transfer
        </div>
        <div class="act">
          <span
            ><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2">
              <path d="M12 5v14M5 12h14" /></svg></span
          >Add account
        </div>
        <div class="act">
          <span
            ><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2">
              <rect x="4" y="5" width="16" height="14" rx="3" />
              <path d="M8 10h8M8 14h5" /></svg></span
          >Details
        </div>
        <div class="act">
          <span
            ><svg viewBox="0 0 24 24" fill="#fff">
              <circle cx="6" cy="12" r="1.8" />
              <circle cx="12" cy="12" r="1.8" />
              <circle cx="18" cy="12" r="1.8" /></svg></span
          >More
        </div>
      </div>
    </section>
    <section class="sheet num">
      <h2>Transactions</h2>
      <div class="tx">
        <span class="ic i-out">↗</span
        ><span><b>To 0098765432</b><small>Today · Transfer out</small></span
        ><span class="amt">−$400.00</span>
      </div>
      <div class="tx">
        <span class="ic i-rc">$</span><span><b>Salary</b><small>Nov 9 · Recharge</small></span
        ><span class="amt pos">+$3,200.00</span>
      </div>
      <div class="tx">
        <span class="ic i-in">↙</span
        ><span><b>From 0055501234</b><small>Nov 8 · Transfer in</small></span
        ><span class="amt pos">+$150.00</span>
      </div>
    </section>
    <nav class="tabs">
      <a class="on" href="#"
        ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 10l9-6 9 6v10H3z" /></svg
        >Home</a
      >
      <a href="#"
        ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 8h13l-3-3M20 16H7l3 3" /></svg
        >Transfers</a
      >
      <a href="#"
        ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="6" width="18" height="13" rx="3" />
          <path d="M3 10h18" /></svg
        >Accounts</a
      >
      <a href="#"
        ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 7v5l3 2" />
          <circle cx="12" cy="12" r="9" /></svg
        >History</a
      >
    </nav>
  </body>
</html>
